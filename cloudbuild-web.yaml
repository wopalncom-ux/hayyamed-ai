steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/web:$COMMIT_SHA
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://api.hayyaai.com/api/v1
      - --build-arg
      - NEXT_PUBLIC_WS_URL=wss://api.hayyaai.com
      - apps/web

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/web:$COMMIT_SHA

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hayyamed-web
      - --image=me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/web:$COMMIT_SHA
      - --region=me-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5

images:
  - me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/web:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
