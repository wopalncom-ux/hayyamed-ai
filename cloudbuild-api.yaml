steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/api:$COMMIT_SHA
      - -f
      - apps/api/Dockerfile
      - apps/api

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/api:$COMMIT_SHA

  # Image-only update — preserves all existing Cloud Run env vars and secrets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hayyamed-api
      - --image=me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/api:$COMMIT_SHA
      - --region=me-central1
      - --platform=managed

images:
  - me-central1-docker.pkg.dev/$PROJECT_ID/hayyamed-ai/api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
